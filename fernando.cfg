// ============================================================
//  autoexec.cfg — CS2
//  Gerado com base no seu perfil personalizado
//  Nível: Avançado | Foco: Competitivo
// ============================================================


// ============================================================
//  MOUSE
//  DPI: 800 | eDPI alvo: ~960 | Mousepad: extended
// ============================================================

sensitivity 1.2              // 800 DPI x 1.2 = 960 eDPI (zona competitiva ideal)
zoom_sensitivity_ratio_mouse 1.0  // sens proporcional ao dar zoom (scout/awp)
m_rawinput 1                 // input direto do mouse, ignora aceleração do Windows
m_mouseaccel1 0              // desativa aceleração interna do CS2 (nível 1)
m_mouseaccel2 0              // desativa aceleração interna do CS2 (nível 2)
m_customaccel 0              // sem aceleração customizada
m_mousespeed 0               // garante que o Windows não interfere na sens


// ============================================================
//  VÍDEO E RESOLUÇÃO
//  Monitor: 2560x1440 | Jogo: 1024x768 stretched | 240Hz
//  GPU: AMD
// ============================================================

// -- Resolução e aspect ratio --
// Configure no launcher do CS2 ou via launch options:
// -w 1024 -h 768 -freq 240 -refresh 240 -fullscreen
// E no painel AMD Adrenalin: Scaling Mode = Full Panel (stretched)

r_fullscreen_gamma 2.2       // gamma padrão competitivo
mat_monitorgamma 2.2

// -- FPS e performance --
// fps_max: 2x o Hz do monitor = 480 (evita sobrecarga da GPU AMD,
// mantém frame pacing consistente e reduz input lag)
fps_max 480
fps_max_menu 60              // limita FPS no menu para economizar GPU

// -- Qualidade gráfica (máximo FPS competitivo) --
r_lowlatency 1               // modo baixa latência (AMD equivale ao Nvidia Reflex)
mat_queue_mode -1            // modo de fila automático (melhor para AMD)

// -- Launch options recomendadas (adicione em Propriedades do jogo) --
// -novid -nojoy -freq 240 -refresh 240 +exec autoexec


// ============================================================
//  ÁUDIO
//  Dispositivo: IEM | HRTF: ativado | Foco: passos
// ============================================================

snd_musicvolume 0.3          // música no menu baixinha (não atrapalha)
snd_deathcamera_volume 0.0   // sem música de morte
snd_roundstart_volume 0.3    // volume da música de início de round
snd_roundend_volume 0.3      // volume da música de fim de round
snd_mvp_volume 0.3           // volume da música do MVP

snd_gamevolume 1.0           // volume geral do jogo
snd_menumusic_volume 0.3

// HRTF (áudio espacial 3D — ideal para IEM em competitivo)
// Ative em: Configurações > Áudio > Áudio Espacial > HRTF
// Ou via painel: snd_headphone_pan_exponent 1.2

// Passos em destaque — mix voltado para footsteps
snd_mixahead 0.025           // buffer de áudio reduzido = menor latência de som
snd_front_headphone_position 45.0
snd_rear_headphone_position 135.0


// ============================================================
//  CROSSHAIR
//  Estilo: pequeno | Cor: verde | Estática | Sem outline
// ============================================================

cl_crosshair_drawoutline 0         // sem outline
cl_crosshairalpha 255              // opacidade máxima
cl_crosshaircolor 1                // 1 = verde
cl_crosshairdot 0                  // sem ponto central (cruz limpa)
cl_crosshairgap -2                 // gap negativo = linhas mais próximas ao centro
cl_crosshairsize 2                 // tamanho pequeno das linhas
cl_crosshairthickness 1            // espessura fina
cl_crosshairstyle 4                // estilo estático clássico (style 4 = static)
cl_crosshair_sniper_show_normal_inaccuracy 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 255
cl_crosshaircolor_b 50             // RGB = verde puro


// ============================================================
//  RADAR
//  Posição: superior esquerdo | Tamanho: médio
//  Zoom: aberto | Rotação: fixo
// ============================================================

cl_radar_always_centered 0         // radar não centraliza em você (vê mais mapa)
cl_radar_scale 0.4                 // zoom aberto — vê o mapa inteiro
cl_hud_radar_scale 1.15            // tamanho médio do radar na tela
cl_radar_rotate 0                  // fixo — norte sempre em cima
cl_radar_icon_scale_min 0.6        // ícones dos teammates visíveis mesmo de longe
cl_radar_offset_x 5                // posição horizontal (canto esquerdo)
cl_radar_offset_y 5                // posição vertical (topo)


// ============================================================
//  BINDS
//  Jump: espaço + scroll | Voice: mouse5 | Net graph: F3
// ============================================================

// -- Movimento --
bind "space" "+jump"
bind "mwheeldown" "+jump"          // scroll down pula (bhop)
bind "mwheelup" "+jump"            // scroll up pula (bhop)
bind "shift" "+sprint"             // walk silencioso — CS2 usa +sprint (não +speed)

// -- Interação --
bind "e" "+use"                    // pegar bomba, abrir portas, plantar/desarmar

// -- Armas e granadas (slots corretos do CS2) --
bind "1" "slot1"                   // arma primária (rifle, sniper)
bind "2" "slot2"                   // arma secundária (pistola)
bind "3" "slot3"                   // faca
bind "4" "slot4"                   // granada HE (explosiva)
bind "5" "slot5"                   // flash
bind "6" "slot6"                   // smoke
bind "7" "slot7"                   // molotov / incendiária
bind "8" "slot8"                   // decoy
bind "q" "lastinv"                 // troca rápida para última arma

// Dica: no CS2 os slots de granadas são 4 ao 8 (diferente do CSGO)
// slot4=HE | slot5=flash | slot6=smoke | slot7=molotov | slot8=decoy

// -- Comunicação --
bind "mouse5" "+voicerecord"       // push-to-talk no botão lateral do mouse
// Ajuste para o botão do seu mouse: mouse4 ou mouse5

// -- Utilitários --
bind "F3" "toggle cl_showfps 0 1 2 3"   // toggle net graph / FPS display
bind "F10" "quit"                        // sair do jogo rápido

// -- Buy binds (compra rápida no início do round) --
bind "F1" "buy ak47; buy m4a1; buy vesthelm; buy defuser"  // rifle + armor + kit
bind "F2" "buy awp; buy vesthelm; buy defuser"             // AWP + armor + kit
bind "F4" "buy hegrenade; buy smokegrenade; buy flashbang; buy molotov; buy incgrenade" // utility completa


// ============================================================
//  HUD E INTERFACE
//  Escala: pequena | HP time: sim | Killfeed: visível
//  Damage numbers: sim | Cor: verde
// ============================================================

hud_scaling 0.85                   // HUD pequeno (range: 0.5 a 0.95)
cl_hud_color 5                     // 5 = verde
cl_hud_background_alpha 0.5        // fundo do HUD semi-transparente
cl_showloadout 1                   // sempre mostra loadout de granadas

// Teammates HP
cl_teamid_overhead_always 2        // mostra HP dos teammates acima da cabeça + radar

// Killfeed
cl_killfeed_enabled 1              // killfeed sempre visível

// Damage numbers
cl_show_observer_crosshair 1
// Damage recebido/causado aparece automaticamente no CS2 moderno
// Confirme em: Configurações > Jogo > Mostrar impacto de bala = Sim

// Outros elementos de HUD
cl_hud_healthammo_style 0          // estilo de vida/munição detalhado
cl_draw_only_deathnotices 0        // mantém HUD completo


// ============================================================
//  NETCODE E RATES
//  Internet: fibra | Ping: baixo | Conexão: cabo ethernet
//  Interp: mínimo recomendado para baixo ping
// ============================================================

// -- Rates (máximo para fibra + cable + ping baixo) --
rate 786432                        // máximo permitido pelo CS2 (~6.3 Mbps)
cl_cmdrate 128                     // comandos enviados ao servidor por segundo
cl_updaterate 128                  // atualizações recebidas do servidor por segundo

// -- Interpolação --
// Com ping baixo e cabo, usamos interpolação mínima:
// O jogo vê os inimigos na posição mais próxima da real,
// reduzindo a sensação de "tiro que não registrou"
cl_interp 0                        // deixa o jogo calcular automaticamente
cl_interp_ratio 1                  // ratio mínimo (1 = mais responsivo, menos suavização)
// Nota: CS2 usa tick 64 nos servidores oficiais e 128 no FACEIT

// -- Lag compensation --
cl_lagcompensation 1               // compensação de lag ativada (sempre deixe 1)

// -- Packet loss e jitter (cabo = estável, configs agressivas ok) --
net_maxroutable 1200               // tamanho máximo de pacote


// ============================================================
//  PERFORMANCE E MISC
// ============================================================

cl_forcepreload 1                  // pré-carrega assets ao entrar no mapa (menos stutters)
r_dynamic 0                        // desativa luzes dinâmicas (mais FPS, menos distração visual)
mat_displacementmap 0              // desativa displacement maps (ganho de FPS em AMD)

// Feedback visual de acerto
cl_show_bullet_impacts 0           // sem marcas de bala durante partidas (menos poluição visual)

// Console
con_enable 1                       // ativa o console
con_filter_enable 0

// Confirma o exec
echo "==============================="
echo " autoexec.cfg carregado!"
echo " Perfil: Avancado | Competitivo"
echo " eDPI: 960 | 1024x768 stretched"
echo " 240Hz | Fibra | HRTF ON"
echo "==============================="
